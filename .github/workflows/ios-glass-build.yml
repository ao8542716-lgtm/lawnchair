name: iOS Glass debug APK

# Builds only the debug APK (the stock CI also builds a signed release, which a fork cannot sign).
on:
  push:
    branches:
      - ios-glass
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ios-glass-debug-apk
          path: build/outputs/apk/**/*.apk
